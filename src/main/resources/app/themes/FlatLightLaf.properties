# Archivo de configuración de temas personalizados para FlatLaf

# --- Colores Principales ---
# Define el color de acento principal (naranja) para toda la aplicación
@accentColor=#f8513e

# --- Bordes y Enfoque de Componentes ---
# Redondeo general de los componentes (99 crea bordes tipo píldora/circulares)
Component.arc=22

# Grosor del anillo de enfoque cuando un componente está seleccionado
Component.focusWidth=3

# Color del borde cuando tiene el foco (color de acento con 70% de opacidad)
Component.focusedBorderColor=fade(@accentColor,70%)

# Color del anillo de enfoque (color de acento con 25% de opacidad)
Component.focusColor=fade(@accentColor,25%)

# Heredar el redondeo general especifico a botones y campos de texto
Button.arc=$Component.arc
TextComponent.arc=$Component.arc

# --- Estilos Globales para Botones ---
# Al definirlos aquí, se aplicarán a todos los botones manteniendo el redondeo perfecto
Button.background=@accentColor
Button.foreground=#ffffff
Button.hoverBackground=lighten(@accentColor,10%)
Button.pressedBackground=darken(@accentColor,10%)
Button.focusedBackground=@accentColor

Button.focusedForeground=#ffffff
Button.pressedForeground=#ffffff

# --- Márgenes Internos (Padding) ---
Button.margin=6,10,6,10
TextField.margin=6,10,6,10
PasswordField.margin=6,10,6,10
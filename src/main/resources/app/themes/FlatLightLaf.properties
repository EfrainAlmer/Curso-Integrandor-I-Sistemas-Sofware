# Tema de FlatLaf del Sistema de Gestion Academica (azul institucional, aspecto de escritorio).

# --- Color principal ---
@accentColor=#2B5F94

# --- Bordes y foco ---
Component.arc=6
Component.focusWidth=1
Component.focusedBorderColor=@accentColor
Component.focusColor=fade(@accentColor,30%)
Button.arc=6
TextComponent.arc=6

# --- Botones: azul con texto blanco ---
Button.background=@accentColor
Button.foreground=#ffffff
Button.hoverBackground=lighten(@accentColor,8%)
Button.pressedBackground=darken(@accentColor,8%)
Button.focusedBackground=@accentColor
Button.focusedForeground=#ffffff
Button.pressedForeground=#ffffff
Button.default.background=@accentColor
Button.default.foreground=#ffffff

# --- Margenes internos ---
Button.margin=6,14,6,14
TextField.margin=6,10,6,10
PasswordField.margin=6,10,6,10
ComboBox.padding=4,8,4,8

# --- Tablas y pestanas ---
Table.selectionBackground=#E3EEF8
Table.selectionForeground=#1E2A3A
TabbedPane.underlineColor=@accentColor
TabbedPane.selectedBackground=#FFFFFF
ProgressBar.arc=6
TableHeader.hoverBackground=#1F3A5F
TableHeader.pressedBackground=#1F3A5F
CheckBox.icon.selectedBackground=@accentColor
